<html lang="ja">
<head>
<meta charset="utf-8">

<title>ひもはどこ？</title>
<meta name="description" content="真っ暗な部屋で、電気のひもを手さぐりで探して引くゲーム。音を頼りに、ニセのひもにだまされず、家族を起こさずに、パッと点けろ！ 5つの夜で合計点を競う。">
<meta name="theme-color" content="#050506">
<meta property="og:type" content="website">
<meta property="og:title" content="ひもはどこ？">
<meta property="og:description" content="真っ暗な部屋で、電気のひもを手さぐりで探して引け。猫のしっぽ、イヤホンのコード…ニセのひもに気をつけろ。">
<meta property="og:url" content="https://nkworks-games.com/himo-wa-doko/">
<meta property="og:image" content="https://nkworks-games.com/himo-wa-doko/card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101014'/%3E%3Cpath d='M32 4v34' stroke='%23e8e0d0' stroke-width='3'/%3E%3Crect x='27' y='38' width='10' height='14' rx='4' fill='%23f0c04a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#16141a; --gold:#f0c04a; --cream:#f2efe6; --page:#050506; --warm:#ffd88a;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;
  --maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --ad-h:50px;      /* 広告バナーの高さ（スマホ） */
  --ad-gap:75px;    /* バナーとゲームの間。まちがって広告を押さないように、いつも75pxあける（スクリプトも75pxで固定） */
}
@media (orientation: landscape) and (min-width: 728px) and (min-height: 500px){:root{--ad-h:90px}}   /* 横長の画面（パソコンなど）ではバナーを90pxに */
html,body{margin:0;height:100%;background:var(--page);color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* ゲームの場所：ノッチより下・バナーと余白より上。その中に、縦長のゲーム画面（#stage）をまん中に置く */
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(var(--ad-h) + env(safe-area-inset-bottom,0px) + var(--ad-gap));display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;touch-action:none;outline:none;contain:strict;width:360px;height:480px}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;left:0;top:0;width:360px;height:480px;transform-origin:0 0;font-family:var(--maru);font-weight:800;pointer-events:none}
#ui button,#ui a{pointer-events:auto;font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.hide{display:none!important}
.ov{position:absolute;left:0;top:0;right:0;bottom:0}
/* ▼広告バナーの場所（ゲームとは別の、いちばん下の帯） */
#ad-zone{position:fixed;left:0;right:0;bottom:0;z-index:10;height:var(--ad-h);padding-bottom:env(safe-area-inset-bottom,0px);background:#08080a;box-shadow:0 -1px 0 rgba(240,192,74,.12);touch-action:manipulation;-webkit-user-select:auto;user-select:auto}
#ad-banner{width:100%;height:var(--ad-h);overflow:hidden;display:flex;align-items:center;justify-content:center;max-height:var(--ad-h);contain:layout paint}
#ad-banner ins{max-height:var(--ad-h)!important;overflow:hidden}
#ad-banner ins.adsbygoogle[data-ad-status="unfilled"]{display:none!important}   /* 広告が来ない時は 空の四角を出さない（帯の高さは そのまま） */

/* 画面のふち：暗さを強める */
#vig{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.65) 100%)}
#fl{position:absolute;left:0;top:0;right:0;bottom:0;background:#fff8e0;opacity:0}
#fl.go{animation:fl .6s ease-out forwards}#fl.mame{background:#ff9a40}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
/* 上の帯 */
#hud{position:absolute;left:0;top:0;right:0;bottom:0}
.chip{position:absolute;top:10px;height:34px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:17px;background:rgba(20,18,26,.72);border:1px solid rgba(255,255,255,.12);font-size:13px}
#nt{left:10px}#nt b{font-family:var(--pop);font-weight:400;font-size:18px;color:var(--warm)}#nt i{font-style:normal;font-size:11px;opacity:.7}
#tm{left:50%;transform:translateX(-50%);padding:0 10px}#tm svg{width:24px;height:24px}#tm b{font-size:16px;min-width:22px;text-align:right}
#tm.low b{color:#ff8a6a}
#sc{right:52px}#sc b{font-family:var(--pop);font-weight:400;font-size:15px}
#mute{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:17px;border:1px solid rgba(255,255,255,.12);background:rgba(20,18,26,.72);color:#fff;font-size:16px;padding:0}
#mute.off{opacity:.45}
#zz{position:absolute;left:10px;top:52px;display:flex;gap:4px;align-items:center;padding:4px 10px;border-radius:12px;background:rgba(20,18,26,.72);font-size:11px}
#zz i{width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.18);display:inline-block}#zz i.on{background:#ff6a5a}
/* 字幕（音の出来事）と、まん中の文字 */
#cap{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--pop);font-weight:400;font-size:24px;color:#fff;opacity:0;text-shadow:0 2px 8px #000}
#cap.in{animation:cap 1.2s ease-out forwards}#cap.in.long{animation-duration:2.8s}
@keyframes cap{0%{opacity:0;transform:translateY(6px) scale(.9)}12%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* 音を消している時だけ：「カチ…」が どっちから聞こえたかを、文字で出す */
#snd{position:absolute;top:96px;left:0;font-size:15px;white-space:nowrap;color:rgba(255,236,190,.9);text-shadow:0 0 8px rgba(255,200,100,.6);opacity:0;transform:translateX(-50%)}
#snd.in{animation:snd .9s ease-out forwards}
@keyframes snd{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#tip{position:absolute;left:0;right:0;bottom:118px;text-align:center;opacity:0;transition:opacity .25s}
#tip.on{opacity:1}
#tip span{display:inline-block;padding:7px 14px 8px;border-radius:14px;background:rgba(20,18,26,.88);border:1px solid rgba(240,192,74,.7);font-size:13px;line-height:1.4;color:#fff}
#tip b{color:#ffe14a}
/* 左＝歩く・右＝手 の場所の目じるし */
.zone{position:absolute;bottom:14px;width:150px;text-align:center;font-size:12px;color:rgba(255,255,255,.42);letter-spacing:.06em}
.zone i{display:block;margin:0 auto 4px;width:64px;height:64px;border-radius:50%;border:2px dashed rgba(255,255,255,.22)}
#zl{left:15px}#zr{right:15px}#zr i{border-radius:14px}
.dim .zone{opacity:.35}
#joy{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.05);opacity:0;transition:opacity .1s}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.55)}
/* 夜の札（タップでスタート） */
#card{position:absolute;left:0;right:0;top:max(48px,calc(50% - 215px));padding:12px 0 14px;text-align:center;background:linear-gradient(to right,rgba(10,10,14,0),rgba(10,10,14,.9) 14%,rgba(10,10,14,.9) 86%,rgba(10,10,14,0));opacity:0}
#card small{display:block;font-size:13px;color:var(--gold);letter-spacing:.25em;text-indent:.25em}
#card b{display:block;margin:6px 0 2px;font-family:var(--pop);font-weight:400;font-size:34px;line-height:1.15}
#card em{display:block;font-style:normal;font-size:13px;color:#d8d0c0}
#card .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 18px 0}
#bmap{display:block;width:200px;height:200px;margin:10px auto 0;border-radius:12px;background:#15130f}
#card .lg{display:flex;justify-content:center;gap:12px;margin-top:5px;font-size:11px;color:#cfc6b4}
#card .lg i{font-style:normal;font-weight:800}#card .lg .me{color:#7ab8ff}#card .lg .li{color:#ffd23c}#card .lg .fa{color:#e07a80}
#card .tags span{font-size:12px;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
#card .tags span.r{border-color:rgba(255,120,100,.7);color:#ffb0a0}
#mem{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px;font-size:12px;color:#ffe08a}#mem b{font-family:var(--pop);font-weight:400;font-size:17px;min-width:52px;text-align:left}#mem i{width:72px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}#mem u{display:block;height:100%;width:100%;background:var(--gold)}
#card p{margin-top:8px;font-size:14px;letter-spacing:.06em;animation:cdp 1.3s ease-in-out infinite}
#card p::before{content:"▶ ";color:var(--gold)}
#card.go{animation:cdin .3s ease-out forwards}#card.out{animation:cdout .3s ease-in forwards}
@keyframes cdin{0%{opacity:0;transform:translateX(-40px)}100%{opacity:1;transform:none}}
@keyframes cdout{0%{opacity:1}100%{opacity:0;transform:translateX(26px)}}
@keyframes cdp{0%,100%{opacity:1}50%{opacity:.55}}
/* 答え合わせ */
#rev{position:absolute;left:14px;right:14px;bottom:14px;padding:12px 14px 14px;border-radius:18px;background:rgba(250,246,236,.97);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.35);transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
#rev.on{transform:none}
#rh{display:flex;align-items:baseline;justify-content:space-between}
#rh b{font-family:var(--pop);font-weight:400;font-size:22px}#rh b.ng{color:#9a5a4a}
#rh span{font-family:var(--pop);font-weight:400;font-size:24px;color:#c2381f}
#rbody{display:flex;gap:10px;margin-top:8px}
#map{width:132px;height:132px;flex:none;border-radius:10px;background:#2a2620}
#rl{flex:1;font-size:13px;line-height:1.75}
#rl div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(0,0,0,.12)}
#rl div.m{color:#b0392a}#rl div.t{border:0;font-size:14px}
#rnote{margin-top:6px;font-size:12px;color:#6a5a48;min-height:16px}
#next{display:block;width:100%;margin-top:10px;height:46px;border:0;border-radius:23px;background:var(--ink);color:#fff;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
/* タイトル */
#title{background:radial-gradient(ellipse at 50% 30%,#1c1a24 0%,#060608 70%);display:flex;flex-direction:column;align-items:center;padding-top:4%}
#logo{margin:0;text-align:center;line-height:1}
#logo .cord{display:block;width:3px;height:40px;margin:0 auto;background:linear-gradient(#5a5650,#e8e0d0)}
#logo .knob{display:block;width:16px;height:22px;margin:-2px auto 10px;border-radius:9px;background:var(--gold);box-shadow:0 0 18px rgba(240,192,74,.6)}
#logo .t{display:block;font-family:var(--pop);font-weight:400;font-size:38px;color:#fff;letter-spacing:.02em}
#logo .lc{font-size:16px;color:#aaa;vertical-align:top}
#logo small{display:block;margin-top:7px;font-size:13px;color:#cfc6b4;letter-spacing:.08em}
#how{margin:14px 24px 0;font-size:12.5px;line-height:1.45;color:#e6e0d4}
#how p{margin:0 0 5px;display:flex;gap:8px}#how i{flex:none;width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--ink);font-style:normal;font-size:12px;text-align:center;line-height:20px}
#how b{color:var(--warm)}
#ear{margin-top:4px;font-size:11.5px;color:#9ad0ff;text-align:center}
#best0{margin-top:6px;font-size:12px;color:#cfc6b4;min-height:15px}
#go{margin-top:8px;width:230px;height:54px;border:0;border-radius:29px;background:var(--gold);color:var(--ink);font-family:var(--pop);font-weight:400;font-size:24px;box-shadow:0 5px 0 #a8801c}
.cr{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.35)}
/* 結果 */
#res{background:rgba(6,6,8,.92);display:flex;flex-direction:column;align-items:center;padding-top:7%}
#rk{font-size:13px;color:var(--gold);letter-spacing:.2em}
#rkv{margin-top:4px;font-family:var(--pop);font-weight:400;font-size:34px;color:#fff}
#tot{margin-top:6px;font-family:var(--pop);font-weight:400;font-size:20px;color:var(--warm)}
#nb{margin-top:4px;font-size:12px;color:#ff9a7a;min-height:15px}
#nights{margin:12px 22px 0;width:calc(100% - 44px);font-size:13px}
#nights div{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
#nights div span:last-child{font-family:var(--pop);font-weight:400}
#nights div.ng span:last-child{color:#ff8a6a}
.btns{display:flex;gap:10px;margin-top:16px}
#share,#retry{height:50px;padding:0 22px;border:0;border-radius:25px;font-size:15px;display:flex;align-items:center;text-decoration:none}
#share{background:#fff;color:#000}#retry{background:var(--gold);color:var(--ink)}
#home{margin-top:12px;background:none;border:0;color:#bbb;font-size:13px;text-decoration:underline}
#load{position:absolute;left:0;right:0;top:45%;text-align:center;color:#888;font-size:13px}
</style>
<style>/* nkw-info：説明ページへのリンク */.nkw-info{display:inline-block;margin-left:.8em;padding:6px 2px;color:inherit;text-decoration:underline;text-underline-offset:2px;pointer-events:auto;letter-spacing:.06em;-webkit-user-select:none;user-select:none}</style>
</head>
<body>
<div id="app">
  <div id="stage" tabindex="-1">
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="vig"></div>
      <div id="fl"></div>
      <div id="hud" class="hide">
        <div id="nt" class="chip"><b id="ntv">1</b><i>夜目 / 5</i></div>
        <div id="tm" class="chip"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/><circle id="tmr" cx="14" cy="14" r="11" fill="none" stroke="#ffd88a" stroke-width="4" stroke-linecap="round" stroke-dasharray="69.1" stroke-dashoffset="0" transform="rotate(-90 14 14)"/></svg><b id="tmv">30</b></div>
        <div id="sc" class="chip"><b id="scv">0</b>点</div>
        <div id="zz" class="hide">家族<i></i><i></i><i></i></div>
        <div id="zl" class="zone"><i></i>左の指で あるく</div>
        <div id="zr" class="zone"><i></i>右の指で 手をのばす</div>
        <div id="tip"><span id="tipt"></span></div>
        <div id="joy"><i></i></div>
        <div id="cap"></div>
        <div id="snd">カチ…</div>
      </div>
      <button id="mute" aria-label="音">♪</button>
      <div id="card"><small id="cdn"></small><b id="cdt"></b><em id="cdr"></em><canvas id="bmap" width="400" height="400"></canvas><div class="lg"><span><i class="me">▲</i> 自分（向き）</span><span><i class="li">★</i> 電気のひも</span><span id="lgf"><i class="fa">■</i> 家族</span></div><div class="tags" id="cdg"></div><div id="mem"><span>記憶ボーナス</span><b id="memv">×1.50</b><i><u id="memb"></u></i></div><p id="cdp"></p></div>
      <div id="rev"><div id="rh"><b id="rhb"></b><span id="rhs"></span></div><div id="rbody"><canvas id="map" width="264" height="264"></canvas><div id="rl"></div></div><div id="rnote"></div><button id="next">次の夜へ</button></div>
      <div id="title" class="ov hide">
        <h1 id="logo"><span class="cord"></span><span class="knob"></span><span class="t">ひもはどこ？<span class="lc hide">（仮）</span></span><small>真っ暗な部屋で、電気のひもを探せ</small></h1>
        <div id="how">
          <p><i>1</i><span>左の指で<b>あるく</b>、右の指をなでると<b>手</b>が動く</span></p>
          <p><i>2</i><span>ひもに さわったら、そのまま<b>下へ引く</b>。強すぎると豆電球…</span></p>
          <p><i>3</i><span><b>部屋の図</b>を早く閉じるほど<b>ボーナス</b>。「カチ…」の光と音がたより</span></p>
          <p><i>4</i><span>待つと目が慣れて見えてくる。でも<b>点は下がる</b></span></p>
          <div id="ear">音を出して遊んでください（イヤホンだと左右が分かる）</div>
        </div>
        <div id="best0"></div>
        <button id="go">はじめる</button>
        <div class="cr">N.K. Works<a class="nkw-info" href="/games/himo-wa-doko/">遊び方・ほかのゲーム ›</a></div>
      </div>
      <div id="res" class="ov hide">
        <div id="rk">5つの夜の けっか</div>
        <div id="rkv"></div>
        <div id="tot"></div>
        <div id="nb"></div>
        <div id="nights"></div>
        <div class="btns"><a id="share" target="_blank" rel="noopener">Xでシェア</a><button id="retry">もう一回</button></div>
        <button id="home">タイトルへ</button>
      </div>
      <div id="load">よみこみ中…</div>
    </div>
  </div>
</div>
<!-- ▼広告バナーの場所（画面のいちばん下の帯）
     ・帯の高さ：スマホは50px、横長の画面（パソコンなど）は90px。ゲームとの間は いつも75pxあけてあります
     ・広告が出ない時も、この帯の高さは そのまま残ります（ゲームの位置は ずれません）
     ・ゲームの操作は、この帯の上では反応しません -->
<div id="ad-zone">
  <div id="ad-banner"><!-- 広告は一時停止中：AdSenseのサイト審査が通るまで、ゲーム画面では広告を読み込みません（帯と余白はそのまま）。審査後にこの変更を元に戻します -->
